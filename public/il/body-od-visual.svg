<svg width="100%" viewBox="0 0 680 455" xmlns="http://www.w3.org/2000/svg" role="img">
<title>身体と身体・場・文化を介して双方向に絡み合う循環の場</title>
<desc>三人の身体から互いに直接つながる輪と、循環ループで結ばれている。各ループは一方の身体から文化を通じ他方の身体へ届き、意識のさざ波を経て届く。上部には文化の繊維、中ほどには場・空気の横の流れ、意識の高さには各自の波紋。身体・意識・場・組織文化が互いに影響し合いながら絡み合う様子を表す。</desc>
<defs>
<linearGradient id="rise" x1="0" y1="410" x2="0" y2="70" gradientUnits="userSpaceOnUse">
<stop class="g0" offset="0" stop-color="#6a5d4d" stop-opacity="0.66"/>
<stop class="g1" offset="1" stop-color="#6a5d4d" stop-opacity="0.34"/>
</linearGradient>
<style>
.loop{fill:none;stroke:url(#rise);stroke-linecap:round}
.canopy{fill:none;stroke:#8a7762;stroke-linecap:round}
.field{fill:none;stroke:#7e8c92;stroke-linecap:round}
.ripple{fill:none;stroke:#7e8c92;stroke-width:0.8}
.src{fill:#5b4f42}
.ground{stroke:#5b4f42;stroke-linecap:round}
.lbl-jp{fill:#4a4138;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-size:14px}
.lbl-en{fill:#9a8e7b;font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:1.5px}
@media (prefers-color-scheme: dark){
.g0,.g1{stop-color:#d9cebb}
.canopy{stroke:#cdbfa9}
.field,.ripple{stroke:#9fb0b6}
.src,.ground{fill:#cdbfa9;stroke:#cdbfa9}
.lbl-jp{fill:#dcd5c8}
.lbl-en{fill:#9d927f}
}
</style>
</defs>

<path class="canopy" stroke-width="1" stroke-opacity="0.42" d="M150,100 Q232,94 312,100 T468,100">
<animateTransform attributeName="transform" type="translate" values="-6 0;6 0;-6 0" dur="15s" repeatCount="indefinite"/>
</path>
<path class="canopy" stroke-width="1" stroke-opacity="0.32" d="M150,116 Q232,122 312,116 T468,116">
<animateTransform attributeName="transform" type="translate" values="7 0;-7 0;7 0" dur="18s" repeatCount="indefinite"/>
</path>
<path class="canopy" stroke-width="1" stroke-opacity="0.40" d="M152,132 Q234,126 314,132 T466,132">
<animateTransform attributeName="transform" type="translate" values="-5 0;5 0;-5 0" dur="13s" repeatCount="indefinite"/>
</path>
<path class="canopy" stroke-width="0.9" stroke-opacity="0.26" d="M158,150 Q238,156 318,150 T460,150">
<animateTransform attributeName="transform" type="translate" values="6 0;-6 0;6 0" dur="21s" repeatCount="indefinite"/>
</path>

<path class="loop" stroke-width="1.1" d="M200,410 C200,68 320,68 320,410 C320,250 200,250 200,410 Z">
<animate attributeName="stroke-dashoffset" values="0;-23.5" dur="6s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="rotate" values="-1.2 260 410;1.2 260 410;-1.2 260 410" dur="9s" repeatCount="indefinite"/>
</path>
<path class="loop" stroke-width="1.1" d="M320,410 C320,68 440,68 440,410 C440,250 320,250 320,410 Z">
<animate attributeName="stroke-dashoffset" values="0;23.5" dur="7s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="rotate" values="1.2 380 410;-1.2 380 410;1.2 380 410" dur="11s" repeatCount="indefinite"/>
</path>
<path class="loop" stroke-width="1" d="M200,410 C200,52 440,52 440,410 C440,300 200,300 200,410 Z">
<animate attributeName="stroke-dashoffset" values="0;-23.5" dur="8.5s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="rotate" values="0.8 320 410;-0.8 320 410;0.8 320 410" dur="14s" repeatCount="indefinite"/>
</path>

<path class="field" stroke-width="0.9" stroke-opacity="0.30" d="M130,192 Q240,186 350,192 T448,192">
<animateTransform attributeName="transform" type="translate" values="-7 0;7 0;-7 0" dur="14s" repeatCount="indefinite"/>
</path>
<path class="field" stroke-width="0.9" stroke-opacity="0.24" d="M126,212 Q236,206 346,212 T450,212">
<animateTransform attributeName="transform" type="translate" values="8 0;-8 0;8 0" dur="17s" repeatCount="indefinite"/>
</path>
<path class="field" stroke-width="0.8" stroke-opacity="0.18" d="M134,232 Q244,226 354,232 T446,232">
<animateTransform attributeName="transform" type="translate" values="-6 0;6 0;-6 0" dur="20s" repeatCount="indefinite"/>
</path>

<ellipse class="ripple" cx="200" cy="300" rx="4" ry="1.5" opacity="0">
<animate attributeName="rx" values="4;48" dur="5s" begin="0s" repeatCount="indefinite"/>
<animate attributeName="ry" values="1.5;14" dur="5s" begin="0s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.30;0" dur="5s" begin="0s" repeatCount="indefinite"/>
</ellipse>
<ellipse class="ripple" cx="200" cy="300" rx="4" ry="1.5" opacity="0">
<animate attributeName="rx" values="4;48" dur="5s" begin="2.5s" repeatCount="indefinite"/>
<animate attributeName="ry" values="1.5;14" dur="5s" begin="2.5s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.30;0" dur="5s" begin="2.5s" repeatCount="indefinite"/>
</ellipse>
<ellipse class="ripple" cx="320" cy="300" rx="4" ry="1.5" opacity="0">
<animate attributeName="rx" values="4;48" dur="5s" begin="0.9s" repeatCount="indefinite"/>
<animate attributeName="ry" values="1.5;14" dur="5s" begin="0.9s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.30;0" dur="5s" begin="0.9s" repeatCount="indefinite"/>
</ellipse>
<ellipse class="ripple" cx="320" cy="300" rx="4" ry="1.5" opacity="0">
<animate attributeName="rx" values="4;48" dur="5s" begin="3.4s" repeatCount="indefinite"/>
<animate attributeName="ry" values="1.5;14" dur="5s" begin="3.4s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.30;0" dur="5s" begin="3.4s" repeatCount="indefinite"/>
</ellipse>
<ellipse class="ripple" cx="440" cy="300" rx="4" ry="1.5" opacity="0">
<animate attributeName="rx" values="4;48" dur="5s" begin="1.7s" repeatCount="indefinite"/>
<animate attributeName="ry" values="1.5;14" dur="5s" begin="1.7s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.30;0" dur="5s" begin="1.7s" repeatCount="indefinite"/>
</ellipse>
<ellipse class="ripple" cx="440" cy="300" rx="4" ry="1.5" opacity="0">
<animate attributeName="rx" values="4;48" dur="5s" begin="4.2s" repeatCount="indefinite"/>
<animate attributeName="ry" values="1.5;14" dur="5s" begin="4.2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.30;0" dur="5s" begin="4.2s" repeatCount="indefinite"/>
</ellipse>

<line class="ground" x1="178" y1="414" x2="222" y2="414" stroke-width="1" stroke-opacity="0.26"/>
<line class="ground" x1="298" y1="414" x2="342" y2="414" stroke-width="1" stroke-opacity="0.26"/>
<line class="ground" x1="418" y1="414" x2="462" y2="414" stroke-width="1" stroke-opacity="0.26"/>
<circle class="src" cx="200" cy="410" r="2.6"/>
<circle class="src" cx="320" cy="410" r="2.6"/>
<circle class="src" cx="440" cy="410" r="2.6"/>

<text class="lbl-en" x="505" y="108">CULTURE</text>
<text class="lbl-jp" x="505" y="127">組織・文化</text>

<text class="lbl-en" x="505" y="196">FIELD</text>
<text class="lbl-jp" x="505" y="215">場・空気</text>

<text class="lbl-en" x="505" y="292">CONSCIOUSNESS</text>
<text class="lbl-jp" x="505" y="311">意識の状態</text>

<text class="lbl-en" x="505" y="388">BODY</text>
<text class="lbl-jp" x="505" y="407">身体の状態</text>
</svg>
